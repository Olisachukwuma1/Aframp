name: Uptime Monitor

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    name: Check Production Uptime
    runs-on: ubuntu-latest
    steps:
      - name: Check routes
        id: checks
        run: |
          down=""
          for path in / /login /signup /home /charge /transactions /withdraw /wallet; do
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://aframp.vercel.app${path}" || echo "000")
            if [ "$status" = "200" ]; then
              echo "✅ ${path} up"
            else
              echo "⚠️ ${path} returned HTTP ${status}"
              down="${down:+${down},}${path} (HTTP ${status})"
            fi
          done
          echo "down=${down}" >> "$GITHUB_OUTPUT"

      - name: Alert on downtime
        if: steps.checks.outputs.down != ''
        uses: actions/github-script@v7
        with:
          script: |
            const down = '${{ steps.checks.outputs.down }}'
            const affected = down
              .split(',')
              .filter(Boolean)
              .map((endpoint) => `  • ${endpoint}`)
              .join('\n')
            const title = '🚨 AFRAMP endpoint(s) are DOWN'
            const body = [
              '🚨 ALERT: AFRAMP endpoints are DOWN',
              '',
              `Time: ${new Date().toISOString()}`,
              '',
              'Affected:',
              affected,
              '',
              'Check: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
            ].join('\n')

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'uptime',
            })
            if (existing.some((issue) => issue.title === title)) {
              core.notice('An open uptime issue already exists — skipping duplicate.')
              return
            }

            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['uptime'],
            })
            console.log(`Created issue #${issue.data.number}`)
